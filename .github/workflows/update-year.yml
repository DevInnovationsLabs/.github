name: Update Copyright Year

on:
  schedule:
    - cron: '0 0 1 1 *'  # Runs every January 1st
  workflow_dispatch:

jobs:
  update-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Update Year
        run: |
          YEAR=$(date +'%Y')
          sed -i "s/© [0-9]\{4\} Dev Innovations Labs/© $YEAR Dev Innovations Labs/" README.md

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "Auto-update copyright year"
          git push
